name = "atsb-ai-translator"
main = "worker/index.js"
compatibility_date = "2026-11-22"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/health", "/api/*", "/discord", "/telegram", "/privacy", "/terms"]

[vars]
DEFAULT_LANGUAGE = "vi"
GEMINI_MODEL = "gemini-2.5-flash"
GROQ_MODEL = "openai/gpt-oss-20b"
